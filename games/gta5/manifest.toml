# Game manifest: Grand Theft Auto V, BLES01807 (EU), disc version 01.03, app 01.00 (docs/decisions.md D-022, D-025).
#
# Read by recomp/common (pspocket::recomp::load_manifest). TOML subset; unknown keys are errors.
# Data only: hashes, addresses, bytes, names. No game code or data (CLAUDE.md rule 1).
# Phase 0 inventory of these files: docs/phase0-gta5.md.

title_id = "BLES01807"          # PARAM.SFO TITLE_ID
title = "Grand Theft Auto V"
app_version = "01.00"           # PARAM.SFO APP_VER of the disc EBOOT (no update applied yet)

