# XcodeGen spec for the iOS test host (docs/decisions.md D-007, D-008).
#
# Generate it with `scripts/ios.sh gen` (`build` does it too). The script builds the host CMake tree first, so the
# build-time generated self-test code exists, and exports the variables this file expands:
#   PSPOCKET_HOST_BUILD_DIR   absolute path of the host CMake build (default build/host). Its generated/selftest/
#                             sources are compiled into the runtime library when they exist.
#   PSPOCKET_PPU_SRC          runtime/ppu/src once runtime/ppu has a CMakeLists.txt.
# A plain `xcodegen generate` without them still works; the project then has neither.
# The generated PSPocket.xcodeproj is build output and is not committed.

name: PSPocket

options:
  bundleIdPrefix: com.artzymeri.pspocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: false
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: M7XJA39ZV6
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # scripts/ios.sh overrides these two on the xcodebuild command line (CMake project version, git commit).
    PSPOCKET_VERSION: 0.1.0
    PSPOCKET_GIT_HASH: unknown
    MARKETING_VERSION: $(PSPOCKET_VERSION)
    CURRENT_PROJECT_VERSION: "1"
    PSPOCKET_ROOT: $(SRCROOT)/../..
    PSPOCKET_HOST_BUILD_DIR: ${PSPOCKET_HOST_BUILD_DIR}
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: c11
    # Lifted code may use <arm_neon.h> (D-003); the simulator build is arm64 only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  # The runtime, compiled from the same sources as the host CMake build (D-007).
  PSPocketRuntime:
    type: library.static
    platform: iOS
    sources:
      - path: ../../runtime/core/src
        name: core
        group: Runtime
        includes: &compiled ["**/*.c", "**/*.cpp", "**/*.cc", "**/*.m", "**/*.mm", "**/*.S", "**/*.s"]
      # Joins once runtime/ppu/CMakeLists.txt exists, as in the host build (pspocket_add_component), so sources that
      # are still being written don't break this build. scripts/ios.sh sets PSPOCKET_PPU_SRC.
      - path: ${PSPOCKET_PPU_SRC}
        name: ppu
        group: Runtime
        optional: true
        includes: *compiled
      - path: ../../runtime/selftest/src
        name: selftest
        group: Runtime
        includes: *compiled
      - path: ../../runtime/disc/src
        name: disc
        group: Runtime
        includes: *compiled
      # What runs a game (the Game tab, pspocket/platform/game.h): the same components as pspocket-boot on the Mac.
      - path: ../../runtime/spu/src
        name: spu
        group: Runtime
        includes: *compiled
        compilerFlags: [-ffp-contract=off, -fno-fast-math]
      - path: ../../runtime/lv2/src
        name: lv2
        group: Runtime
        includes: *compiled
      - path: ../../runtime/hle/src
        name: hle
        group: Runtime
        includes: *compiled
      - path: ../../runtime/rsx/src
        name: rsx
        group: Runtime
        includes: *compiled
      - path: ../../runtime/rsx/metal/src
        name: rsx-metal
        group: Runtime
        includes: *compiled
      - path: ../../runtime/loader/src
        name: loader
        group: Runtime
        includes: *compiled
      - path: ../../recomp/common/src
        name: recomp-common
        group: Runtime
        includes: *compiled
      # recomp/common's NID and syscall tables, embedded by the host build.
      - path: ${PSPOCKET_HOST_BUILD_DIR}/recomp/common/generated
        name: generated-recomp-common
        group: Generated
        optional: true
        includes: *compiled
      - path: ../../runtime/platform/ios/src
        name: platform-ios
        group: Runtime
        includes: *compiled
      - path: ../../runtime/platform/apple/src
        name: platform-apple
        group: Runtime
        includes: *compiled
      # The game's lifted SPU programs (scripts/lift-spu.sh, D-076), from the user's own game outside the repository
      # (CLAUDE.md rule 1). scripts/ios.sh sets PSPOCKET_GAME_SPU_SRC (and PSPOCKET_HAVE_GAME_SPU) when it finds them.
      # Never built with -ffast-math (CLAUDE.md); the generated-code warning set, as pspocket_set_generated_warnings().
      - path: ${PSPOCKET_GAME_SPU_SRC}
        name: game-spu
        group: Generated
        optional: true
        includes: ["**/*.c"]
        compilerFlags: [-ffp-contract=off, -fno-fast-math, -Wno-unused-variable, -Wno-unused-but-set-variable,
                        -Wno-unused-label, -Wno-unused-function, -Wno-unused-parameter]
      # The game's PPU code translated ahead of time (ppu-lift, D-092), from the user's own game outside the repository
      # (CLAUDE.md rule 1). scripts/ios.sh sets PSPOCKET_GAME_PPU_SRC (and PSPOCKET_HAVE_GAME_PPU) when it finds it.
      # About 800 MB of C for GTA V: no debug information, as in the host build (runtime/loader/CMakeLists.txt).
      - path: ${PSPOCKET_GAME_PPU_SRC}
        name: game-ppu
        group: Generated
        optional: true
        includes: ["*.c"]
        compilerFlags: [-g0, -ffp-contract=off, -fno-fast-math, -Wno-unused-variable, -Wno-unused-but-set-variable,
                        -Wno-unused-label, -Wno-unused-function, -Wno-unused-parameter]
      # Lifted self-test code, generated by the host build (recomp/ppu). Same reduced warning set as CMake's
      # pspocket_set_generated_warnings().
      - path: ${PSPOCKET_HOST_BUILD_DIR}/generated/selftest
        name: generated-selftest
        group: Generated
        optional: true
        includes: *compiled
        compilerFlags: [-Wno-unused-variable, -Wno-unused-but-set-variable, -Wno-unused-label, -Wno-unused-function,
                        -Wno-unused-parameter]
    settings:
      base:
        PRODUCT_NAME: PSPocketRuntime
        SKIP_INSTALL: YES
        # The Metal backend and the game session are Objective-C++ with ARC (as -fobjc-arc in CMake).
        CLANG_ENABLE_OBJC_ARC: YES
        # Resolve includes like the CMake build does: no header maps, explicit search paths only.
        USE_HEADERMAP: NO
        HEADER_SEARCH_PATHS:
          - $(PSPOCKET_ROOT)/runtime/core/include
          - $(PSPOCKET_ROOT)/runtime/ppu/include
          - $(PSPOCKET_ROOT)/runtime/selftest/include
          - $(PSPOCKET_ROOT)/runtime/selftest/src
          - $(PSPOCKET_ROOT)/runtime/platform/ios/include
          - $(PSPOCKET_ROOT)/runtime/platform/apple/include
          - $(PSPOCKET_ROOT)/runtime/disc/include
          - $(PSPOCKET_ROOT)/runtime/spu/include
          - $(PSPOCKET_ROOT)/runtime/lv2/include
          - $(PSPOCKET_ROOT)/runtime/lv2/src
          - $(PSPOCKET_ROOT)/runtime/hle/include
          - $(PSPOCKET_ROOT)/runtime/rsx/include
          - $(PSPOCKET_ROOT)/runtime/rsx/metal/include
          - $(PSPOCKET_ROOT)/runtime/loader/include
          - $(PSPOCKET_ROOT)/recomp/common/include
          - $(PSPOCKET_HOST_BUILD_DIR)/generated/selftest
          - $(PSPOCKET_HOST_BUILD_DIR)/generated
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - 'PSPOCKET_VERSION=\"$(PSPOCKET_VERSION)\"'
          - 'PSPOCKET_GIT_HASH=\"$(PSPOCKET_GIT_HASH)\"'
          - PSPOCKET_HAVE_GAME_SPU=${PSPOCKET_HAVE_GAME_SPU}
          - PSPOCKET_HAVE_GAME_PPU=${PSPOCKET_HAVE_GAME_PPU}
        # cmake/PSPocketWarnings.cmake, without -Werror. Xcode's defaults that the host build doesn't use are off,
        # so warning-free on the host means warning-free here (bar iOS-only code paths).
        CLANG_WARN_COMMA: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        CLANG_WARN_RANGE_LOOP_ANALYSIS: NO
        CLANG_WARN_STRICT_PROTOTYPES: NO
        CLANG_WARN_SUSPICIOUS_MOVE: NO
        CLANG_WARN_UNREACHABLE_CODE: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        GCC_WARN_UNINITIALIZED_AUTOS: YES
        WARNING_CFLAGS:
          - -Wall
          - -Wextra
          - -Wpedantic
          - -Wshadow
          - -Wnon-virtual-dtor
          - -Wcast-align
          - -Wunused
          - -Woverloaded-virtual
          - -Wnull-dereference
          - -Wdouble-promotion
          - -Wformat=2
          - -Wimplicit-fallthrough
          - -Wno-gnu-zero-variadic-macro-arguments
          - -Wno-gnu-anonymous-struct
          - -Wno-nested-anon-types
          - -Wno-c99-extensions
      configs:
        Release:
          # Same as the host build (CMake RelWithDebInfo): -O2 and NDEBUG.
          GCC_OPTIMIZATION_LEVEL: "2"
          OTHER_CFLAGS: [$(inherited), -DNDEBUG]

  # SwiftUI app: the game (pick its disc image in Files, boot it), self-test probes and a Metal output/pacing preview.
  PSPocket:
    type: application
    platform: iOS
    sources:
      - path: PSPocket
      # The shaders the Mac recorded for the game (pspocket-boot --shader-cache, D-114), made ahead while it loads: a
      # folder named shaders in the app (here: a library's resources reach no bundle). Game data outside the repository
      # (CLAUDE.md rule 1); scripts/ios.sh sets PSPOCKET_GAME_SHADERS_SRC when it finds one.
      - path: ${PSPOCKET_GAME_SHADERS_SRC}
        type: folder
        buildPhase: resources
        group: Generated
        optional: true
    dependencies:
      - target: PSPocketRuntime
      - sdk: libc++.tbd
      # The game's sound (runtime/platform/apple: AVAudioEngine; the audio session in game.mm).
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: PSPocket
        PRODUCT_BUNDLE_IDENTIFIER: com.artzymeri.pspocket.testhost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PSPocket/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PSPocket
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: PSPocket/PSPocket.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: PSPocket/PSPocket-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PSPOCKET_ROOT)/runtime/selftest/include
          - $(PSPOCKET_ROOT)/runtime/platform/ios/include
          - $(PSPOCKET_ROOT)/runtime/disc/include
        # Load every object of the runtime, so code that registers itself (static initialisers, tables in
        # generated code) is never dropped by the static linker.
        OTHER_LDFLAGS: [$(inherited), -force_load, $(BUILT_PRODUCTS_DIR)/libPSPocketRuntime.a]

schemes:
  PSPocket:
    build:
      targets:
        PSPocket: all
    # Release everywhere: the numbers the probes print are only meaningful optimised. Switch to Debug to debug.
    run:
      config: Release
      commandLineArguments:
        "-autorun": false
        "-autorun-exit": false
    profile:
      config: Release
    archive:
      config: Release
